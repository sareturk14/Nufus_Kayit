<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nüfus Yönetim Sistemi</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for a polished, modern look */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Toast Animasyonları */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .toast-enter {
            animation: slideInRight 0.4s ease-out;
        }

        .toast-exit {
            animation: slideOutRight 0.3s ease-in forwards;
        }
    </style>
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased min-h-screen p-4 md:p-8">

    <!-- Üst Alan -->
    <div class="max-w-5xl mx-auto mb-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <p class="text-xs font-bold tracking-[0.2em] text-[#24B1B1] uppercase mb-1">Vatandaş Veri Tabanı</p>
                <h1 class="text-2xl font-bold text-[#007979] flex items-center gap-2">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                        </path>
                    </svg>
                    Nüfus Kayıt Sistemi
                </h1>
            </div>
            <a href="/liste"
                class="inline-flex items-center gap-2 bg-white border border-gray-200 hover:bg-gray-50 text-[#007979] font-semibold py-2.5 px-5 rounded-lg transition-all text-sm shadow-sm">
                <span>Tüm Vatandaşlar</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                    </path>
                </svg>
            </a>
        </div>
    </div>

    <!-- Ana Form Kartı -->
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

        <!-- Kart Başlığı -->
        <div class="bg-gray-50/50 border-b border-gray-100 px-6 py-4">
            <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                <svg class="w-5 h-5 text-[#24B1B1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
                Yeni Vatandaş Kaydı Ekle
            </h2>
            <p class="text-sm text-gray-500 mt-1">Lütfen tüm alanları eksiksiz ve doğru şekilde doldurunuz.</p>
        </div>

        <!-- HTMX Formu -->
        <form hx-post="/ekle" hx-target="#mesaj-kutusu" class="p-6 md:p-8 space-y-8">

            <!-- BÖLÜM 1: Kimlik Bilgileri -->
            <div>
                <h3
                    class="text-xs font-bold tracking-[0.1em] uppercase text-gray-400 mb-4 border-b border-gray-100 pb-2">
                    Kimlik Bilgileri</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Kimlik No -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">T.C. Kimlik Numarası</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2">
                                    </path>
                                </svg>
                            </span>
                            <input type="text" name="kimlik_no" placeholder="11 haneli T.C. Kimlik No" maxlength="11"
                                required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all font-mono tracking-wide">
                        </div>
                    </div>

                    <!-- İsim -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">İsim</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </span>
                            <input type="text" name="isim" placeholder="Örn: Ahmet" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                        </div>
                    </div>

                    <!-- Soyisim -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Soyisim</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </span>
                            <input type="text" name="soyisim" placeholder="Örn: Yılmaz" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                        </div>
                    </div>

                    <!-- Doğum Tarihi -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Doğum Tarihi</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </span>
                            <input type="date" name="dogum_tarihi" id="dogum-tarihi" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-700 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                        </div>
                    </div>
                </div>
            </div>

            <!-- BÖLÜM 2: Adres Bilgileri -->
            <div>
                <h3
                    class="text-xs font-bold tracking-[0.1em] uppercase text-gray-400 mb-4 border-b border-gray-100 pb-2">
                    Adres Bilgileri</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Şehir -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Şehir</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </span>
                            <input type="text" name="sehir" placeholder="Örn: İstanbul" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                        </div>
                    </div>
                    <!-- İlçe -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">İlçe</label>
                        <input type="text" name="ilce" placeholder="Örn: Kadıköy" required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                    </div>
                    <!-- Mahalle -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Mahalle</label>
                        <input type="text" name="mahalle" placeholder="Örn: Caferağa" required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                    </div>
                </div>
            </div>

            <!-- BÖLÜM 3: Kişisel Durum -->
            <div>
                <h3
                    class="text-xs font-bold tracking-[0.1em] uppercase text-gray-400 mb-4 border-b border-gray-100 pb-2">
                    Kişisel Durum</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Cinsiyet -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Cinsiyet</label>
                        <select name="cinsiyet" id="cinsiyet" required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-700 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all bg-white cursor-pointer">
                            <option value="" disabled selected>Seçiniz...</option>
                            <option value="E">Erkek</option>
                            <option value="K">Kadın</option>
                        </select>
                    </div>
                    <!-- Medeni Durum -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Medeni Durum</label>
                        <select name="medeni_durum" id="medeni_durum" required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-700 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all bg-white cursor-pointer">
                            <option value="" disabled selected>Seçiniz...</option>
                            <option value="BEKAR">Bekar</option>
                            <option value="EVLI">Evli</option>
                        </select>
                    </div>

                    <!-- Kızlık Soyadı (Dinamik) -->
                    <div id="kizlik-soyadi-alani" class="hidden md:col-span-2">
                        <label for="kizlik_soyadi" class="block text-sm font-medium text-gray-700 mb-1.5">Kızlık
                            Soyadı</label>
                        <input type="text" name="kizlik_soyadi" id="kizlik_soyadi"
                            placeholder="Evlenmeden önceki soyadı"
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm placeholder-gray-400 focus:outline-none focus:border-[#24B1B1] focus:ring-2 focus:ring-[#24B1B1]/20 transition-all">
                    </div>

                    <!-- Yaşam Durumu (Modern Toggle) -->
                    <div class="md:col-span-2 pt-2">
                        <label class="flex items-center cursor-pointer group">
                            <div class="relative">
                                <input type="checkbox" name="olu_mu" id="olu_mu" value="E" class="sr-only peer">
                                <div
                                    class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-[#24B1B1]/20 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500">
                                </div>
                            </div>
                            <span
                                class="ms-3 text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors">
                                <span id="status-text">Yaşam Durumu: <span
                                        class="font-semibold text-emerald-600">Aktif</span></span>
                            </span>
                        </label>
                        <p class="text-xs text-gray-400 mt-1.5 ms-14">Varsayılan olarak "Aktif" gelir. Vefat eden
                            vatandaşlar için değiştiriniz.</p>
                    </div>
                </div>
            </div>

            <!-- Alt Butonlar -->
            <div class="pt-6 border-t border-gray-100 flex flex-col sm:flex-row gap-4">
                <button type="submit"
                    class="flex-1 bg-[#007979] hover:bg-[#005f5f] text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 text-sm shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4">
                        </path>
                    </svg>
                    Veri Tabanına Kaydet
                </button>
                <button type="reset"
                    class="sm:w-auto w-full bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 px-6 rounded-lg border border-gray-300 transition-all duration-200 text-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                    Formu Temizle
                </button>
            </div>

        </form>
    </div>

    <!-- İşlem sonucu mesaj kutusu -->
    <div id="mesaj-kutusu" class="fixed top-20 right-4 z-50 w-80"></div>

    <script>
        // Kızlık Soyadı Kontrolü
        const cinsiyet = document.getElementById("cinsiyet");
        const medeniDurum = document.getElementById("medeni_durum");
        const kizlikSoyadiAlani = document.getElementById("kizlik-soyadi-alani");
        const kizlikSoyadi = document.getElementById("kizlik_soyadi");

        function kizlikSoyadıKontrol() {
            const aktif = cinsiyet.value === "K" && medeniDurum.value === "EVLI";

            if (aktif) {
                kizlikSoyadiAlani.classList.remove('hidden');
                kizlikSoyadi.disabled = false;
                kizlikSoyadi.required = true;
            } else {
                kizlikSoyadiAlani.classList.add('hidden');
                kizlikSoyadi.required = false;
                kizlikSoyadi.value = "";
            }
        }

        cinsiyet.addEventListener("change", kizlikSoyadıKontrol);
        medeniDurum.addEventListener("change", kizlikSoyadıKontrol);

        // Doğum tarihi max bugün olsun
        document.getElementById('dogum-tarihi').max = new Date().toISOString().split('T')[0];

        // Yaşam Durumu Toggle Metin Güncelleme
        const oluMuToggle = document.getElementById('olu_mu');
        const statusText = document.getElementById('status-text');

        oluMuToggle.addEventListener('change', function () {
            if (this.checked) {
                statusText.innerHTML = 'Yaşam Durumu: <span class="font-semibold text-red-600">Vefat Eden</span>';
            } else {
                statusText.innerHTML = 'Yaşam Durumu: <span class="font-semibold text-emerald-600">Aktif</span>';
            }
        });
        // Toast kapatma fonksiyonu
        function closeToast(element) {
            element.classList.remove('toast-enter');
            element.classList.add('toast-exit');
            setTimeout(() => {
                element.remove();
            }, 300);
        }
        // Otomatik kapanma için observer
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.addedNodes.length > 0) {
                    mutation.addedNodes.forEach(function (node) {
                        if (node.classList && node.classList.contains('toast-enter')) {
                            // 5 saniye sonra otomatik kapat
                            setTimeout(() => {
                                if (node.parentElement) {
                                    closeToast(node);
                                }
                            }, 5000);
                        }
                    });
                }
            });
        });

        // Mesaj kutusunu izle
        const mesajKutusu = document.getElementById('mesaj-kutusu');
        if (mesajKutusu) {
            observer.observe(mesajKutusu, { childList: true });
        }

    </script>



</body>

</html>
